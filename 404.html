<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 Page Not Found | BX Score Keeper 爆旋計分器</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./BXScoreKeepericon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080c14;
            --neon-blue: #00f0ff;
            --neon-red: #ff0055;
            --neon-yellow: #eab308;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(0, 240, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--text-main);
            font-family: 'Noto Sans TC', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
            border-radius: 12px;
            padding: 40px 24px;
            max-width: 480px;
            width: 100%;
            animation: fadeIn 0.4s ease-out;
        }

        .error-code {
            font-family: 'Orbitron', monospace;
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--neon-red);
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            line-height: 1;
            margin-bottom: 10px;
        }

        .beyblade-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: spin 4s linear infinite;
        }

        h2 {
            font-size: 1.3rem;
            color: var(--neon-blue);
            margin-bottom: 8px;
        }

        p {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .bilingual-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0 25px 0;
            font-size: 0.82rem;
            color: #cbd5e1;
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            background: var(--neon-blue);
            color: #000;
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-home:hover {
            filter: brightness(1.15);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            transform: translateY(-2px);
        }

        .countdown {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--neon-yellow);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="beyblade-icon">⚡</div>
        <div class="error-code">404</div>
        
        <h2>頁面不存在 | Page Not Found</h2>
        
        <div class="bilingual-box">
            <p><strong>【中文】</strong> 抱歉，你所尋找的對戰頁面已移出賽場或連結有誤。</p>
            <p style="margin-bottom:0;"><strong>【EN】</strong> Oops! The battle arena page you are looking for does not exist or has been moved.</p>
        </div>

        <a href="./" class="btn-home" id="btn-return">🔙 返回計分器首頁 / Launch Scoreboard</a>

        <div class="countdown">
            <span id="timer-text">系統將在 <b id="seconds">5</b> 秒後自動返回主頁...</span><br>
            <span style="font-size:0.75rem; color:var(--text-sub);">Auto-redirecting in <b id="seconds-en">5</b>s...</span>
        </div>
    </div>

    <script>
        let timeLeft = 5;
        const secEl = document.getElementById('seconds');
        const secEnEl = document.getElementById('seconds-en');

        const countdownTimer = setInterval(() => {
            timeLeft--;
            if (secEl) secEl.innerText = timeLeft;
            if (secEnEl) secEnEl.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                window.location.href = './';
            }
        }, 1000);
    </script>
</body>
</html>
